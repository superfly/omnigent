# Fly.io config for testing a source checkout. Unlike fly.toml, this builds the
# current worktree instead of pulling the published Omnigent server image.
#
#   fly deploy . -c deploy/fly/fly.source.toml -a <your-app>

app = "omnigent"
primary_region = "iad"

[build]
  dockerfile = "deploy/docker/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  ARTIFACT_DIR = "/data/artifacts"
  OMNIGENT_ADMIN_CREDENTIALS_PATH = "/data/admin-credentials"
  OMNIGENT_AUTH_PROVIDER = "accounts"
  DATABASE_URL = "sqlite:////data/artifacts/chat.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[mounts]
  source = "artifact_data"
  destination = "/data/artifacts"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
